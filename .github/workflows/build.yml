name: Trivy fs scan
on:
  push:
    branches:
    - master
jobs:
  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
    - name: checkout the code repo
      uses: actions/checkout@v4
    - name: Run Trivy vulnerability scanner for Frontend
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: './Frontend'
        format: 'json'
        output: 'frontend-trivy-report.json'
    - name: Run Trivy vulnerability scanner for Backend
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: 'fs'
        scan-ref: './Backend'
        format: 'json'
        output: 'backend-trivy-report.json'
    - name: Upload Trivy fs scan results
      uses: actions/upload-artifact@v4
      with:
        name: Trivy-fs-scan-report
        path: |
          frontend-trivy-report.json
          backend-trivy-report.json
