name: Docker build & push
on:
  push:
    branches:
    - master
jobs:
  owasp-scan:
    runs-on: ubuntu-latest
    steps:
    - name: checkout the code repo
      uses: actions/checkout@v4
    - name: Setup node & npm
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: install packages
      run: |
        cd Frontend
        npm install
        cd ..
    - name: Dependency Check for frontend
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "frontend"
        path: "./Frontend"
        format: "HTML"
        out: "reports"
    - name: rename frontend owasp report file
      run: sudo mv reports/dependency-check-report.html reports/frontend-owasp-report.html
    - name: setup java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "21"
        cache: "maven"
    - name: Build project with Maven
      run: |
        cd Backend
        mvn clean install -DskipTests
        cd ..
    - name: Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "auth-api"
        path: "./Backend"
        format: "HTML"
        out: "reports"
      env:
        JAVA_HOME: /opt/jdk
    - name: rename backend owasp report file
      run: sudo mv reports/dependency-check-report.html reports/backend-owasp-report.html
    - name: Upload owasp results
      uses: actions/upload-artifact@v4
      with:
        name: OWASP-Reports
        path: ${{github.workspace}}/reports

  sonar-scan:
    runs-on: ubuntu-latest
    needs: owasp-scan
    steps:
    - name: checkout the code repo
      uses: actions/checkout@v4
    - name: Setup node & npm
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: install npm packages
      run: |
        cd Frontend
        npm install
        cd ..
    - name: SonarQube Scan for frontend
      uses: SonarSource/sonarqube-scan-action@v2
      with:
          projectBaseDir: Frontend
      env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
    - name: setup java
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "21"
        cache: "maven"
    - name: Build project with Maven
      run: |
        cd Backend
        mvn clean install -DskipTests
        cd ..
    - name: SonarQube Scan for backend
      uses: SonarSource/sonarqube-scan-action@v2
      with:
          projectBaseDir: Backend
      env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

  build-push-trivy-scan:
    runs-on: ubuntu-latest
    needs: sonar-scan
    outputs:
      commit_sha: ${{ steps.get_sha.outputs.sha }}
    steps: 
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get and Set Commit SHA
      id: get_sha
      run: |
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build, tag & push frontend Docker image
      run: |
        docker buildx build -t frontend:latest ./Frontend
        docker tag frontend:latest ${{ steps.login-ecr.outputs.registry }}/cc:frontend-${{ env.sha }}
        docker push ${{ steps.login-ecr.outputs.registry }}/cc:frontend-${{ env.sha }}

    - name: Make Trivy folder
      run: mkdir Trivy
 
    - name: Run Trivy Security Scan on frontend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/cc:frontend-${{ env.sha }}
        format: "json"
        output: "Trivy/frontend-trivy-report.json"
        ignore-unfixed: true
        vuln-type: "os,library"

    - name: Build, tag & push backend Docker image
      run: |
        docker buildx build -t backend:latest ./Backend
        docker tag backend:latest ${{ steps.login-ecr.outputs.registry }}/cc:backend-${{ env.sha }}
        docker push ${{ steps.login-ecr.outputs.registry }}/cc:backend-${{ env.sha }}

    - name: Run Trivy Security Scan on backend image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.login-ecr.outputs.registry }}/cc:backend-${{ env.sha }}
        format: "json"
        output: "Trivy/backend-trivy-report.json"
        ignore-unfixed: true
        vuln-type: "os,library"

    - name: Upload trivy image scan results
      uses: actions/upload-artifact@v4
      with:
        name: Trivy-Reports
        path: ${{github.workspace}}/Trivy

  update-image-tags:
    runs-on: ubuntu-latest
    needs: build-push-trivy-scan
    steps:   
    - name: checkout helm chart repo
      uses: actions/checkout@v4
      with:
        repository: rushiketmodak1/currency-converter-helm-chart
        ref: master
        token: ${{ secrets.GIT_TOKEN }}
    - name: Update frontend docker image in values.yaml
      run: sed -i "s+296062564275.dkr.ecr.ap-south-1.amazonaws.com/cc:frontend-.*+296062564275.dkr.ecr.ap-south-1.amazonaws.com/cc:frontend-${{ needs.build-push-trivy-scan.outputs.commit_sha }}+g" values.yaml
    - name: Update backend docker image in values.yaml
      run: sed -i "s+296062564275.dkr.ecr.ap-south-1.amazonaws.com/cc:backend-.*+296062564275.dkr.ecr.ap-south-1.amazonaws.com/cc:backend-${{ needs.build-push-trivy-scan.outputs.commit_sha }}+g" values.yaml
    - name: Commit updated values.yaml
      run: |
        git config --global user.name "Github-Actions"
        git config --global user.email "github-actions@github.com"
        git add .
        git commit -m "Update frontend and backend image tags to ${{ needs.build-push-trivy-scan.outputs.commit_sha }}"
        git push origin master

      
          